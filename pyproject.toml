[project]
name = "agencyops"
version = "0.2.1"
description = "MCP server enabling AI entities to provision Azure infrastructure with bounded agency"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Rob Mosher"}]
dependencies = [
    "mcp[cli]>=1.2.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.urls]
Repository = "https://github.com/rob-mosher/AgencyOps"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = ["-v", "--strict-markers", "--tb=short"]
markers = [
    "integration: marks tests requiring real terraform/azure",
]
